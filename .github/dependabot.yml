version: 2
updates:
  - package-ecosystem: gomod
    directories: [/, /voice, /state/redis]
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
